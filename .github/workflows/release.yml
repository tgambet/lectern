name: Release

# Push a tag `vX.Y.Z` that matches package.json to publish a GitHub release
# with the static build (`lectern-X.Y.Z.zip`) and the changelog entry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-vp v1.9.0, pinned by commit.
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee
        with:
          node-version-file: .node-version
          cache: true

      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"

      - name: Check, test, build
        run: |
          vp check
          vp test
          vp build

      - name: Package the build
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../lectern-$version.zip" .)

      - name: Extract the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            /^## / && on { exit }
            on
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "lectern-${GITHUB_REF_NAME#v}.zip" \
            --title "Lectern ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
