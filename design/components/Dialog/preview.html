<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}.lc-dialog{position:static;display:block;margin:0}</style></head>
<body>
<div class="lc-stage" data-theme="light"><div class="lc-dialog" role="group" aria-labelledby="t"><div class="lc-dialog__head"><h2 class="lc-dialog__title" id="t">Add a note</h2></div><div class="lc-dialog__body"><blockquote class="lc-dialog__quote">Lectern never writes to your folder.</blockquote><label class="lc-label lc-field-label" for="n">Note</label><textarea class="lc-field" id="n" rows="3"></textarea><div class="lc-dialog__actions"><button class="lc-btn lc-btn--primary">Save note</button><button class="lc-btn">Cancel</button></div></div></div></div>
</body></html>
